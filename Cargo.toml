[workspace]
resolver = "2"
members = [
    "crates/pytagshield-core",
    "crates/pytagshield-server",
    "crates/pytagshield-python",
]

# The Python extension module is excluded from default builds so that the
# normal event-processing path never requires a Python interpreter.
default-members = [
    "crates/pytagshield-core",
    "crates/pytagshield-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/Mullassery/PyTagShield"
authors = ["PyTagShield contributors"]
homepage = "https://github.com/Mullassery/PyTagShield"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
