[package]
name = "pytagshield"
description = "Python bindings for PyTagShield: a consent-aware, privacy-minimizing event pipeline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["analytics", "privacy", "consent", "gdpr", "event-pipeline"]
categories = ["api-bindings"]

[lib]
name = "pytagshield"
crate-type = ["cdylib"]

[dependencies]
pytagshield-core = { path = "../pytagshield-core" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
serde_json.workspace = true
chrono.workspace = true
