[package]
name = "pytagshield-server"
description = "Axum-based HTTP ingest server for PyTagShield."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true

[dependencies]
pytagshield-core = { path = "../pytagshield-core" }
axum = "0.8"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tower = { version = "0.5", features = ["limit"] }
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util", "limit"] }
http-body-util = "0.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
