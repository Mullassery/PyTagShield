<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">PyTagShield — consent-aware, privacy-minimizing analytics events</title>
  <desc id="desc">PyTagShield banner: validate, resolve consent, minimize, route and deliver events.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07140f"/>
      <stop offset="1" stop-color="#0c2118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="24" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="280" rx="4" fill="url(#accent)"/>
  <g transform="translate(72 78)">
    <rect x="0" y="0" width="124" height="124" rx="28" fill="#0c2118" stroke="#34d399" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M62 30l30 12v24c0 20-13 33-30 40-17-7-30-20-30-40V42z" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M48 67l10 10 20-21" fill="none" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="232" y="122" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="750" fill="#ecfdf5" letter-spacing="-1">PyTagShield</text>
  <text x="234" y="170" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" fill="#a7f3d0">Consent-aware, privacy-minimizing analytics events.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#67e8f9">
    <text x="234" y="216">Rust core · Python API · validate → consent → minimize → route → deliver</text>
  </g>
</svg>
